<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EduAlerta — Deserción Académica</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>

  <div class="contenedor">

    <!-- ENCABEZADO -->
    <header>
      <h1>🎓 EduAlerta</h1>
      <p>Analizador de riesgo de deserción académica con IA local</p>
      <div id="estado-modelo" class="estado">⏳ Verificando Ollama...</div>
    </header>

    <!-- FORMULARIO -->
    <section class="tarjeta">
      <h2>Datos del Estudiante</h2>

      <div class="grupo">
        <label>Nombre del estudiante</label>
        <input type="text" id="nombre" placeholder="Ej. Carlos Pérez" />
      </div>

      <div class="fila-dos">
        <div class="grupo">
          <label>Semestre</label>
          <select id="semestre">
            <option value="">Seleccionar...</option>
            <option>1° semestre</option>
            <option>2° semestre</option>
            <option>3° semestre</option>
            <option>4° semestre</option>
            <option>5° semestre</option>
            <option>6° semestre o más</option>
          </select>
        </div>
        <div class="grupo">
          <label>Programa académico</label>
          <input type="text" id="programa" placeholder="Ej. Ingeniería de Sistemas" />
        </div>
      </div>

      <div class="fila-tres">
        <div class="grupo">
          <label>Promedio (0 a 5)</label>
          <input type="number" id="promedio" min="0" max="5" step="0.1" placeholder="3.5" />
        </div>
        <div class="grupo">
          <label>Asistencia (%)</label>
          <input type="number" id="asistencia" min="0" max="100" placeholder="80" />
        </div>
        <div class="grupo">
          <label>Materias perdidas</label>
          <input type="number" id="perdidas" min="0" max="20" placeholder="0" />
        </div>
      </div>

      <div class="fila-dos">
        <div class="grupo">
          <label>¿Trabaja actualmente?</label>
          <select id="trabaja">
            <option value="">Seleccionar...</option>
            <option>No trabaja</option>
            <option>Trabajo tiempo parcial</option>
            <option>Trabajo tiempo completo</option>
          </select>
        </div>
        <div class="grupo">
          <label>Estado emocional</label>
          <select id="emocional">
            <option value="">Seleccionar...</option>
            <option>Motivado y bien</option>
            <option>Regular, algo estresado</option>
            <option>Desmotivado</option>
            <option>En crisis o muy mal</option>
          </select>
        </div>
      </div>

      <div class="grupo">
        <label>¿Alguna situación especial? (opcional)</label>
        <textarea id="comentario" rows="3" placeholder="Ej. tiene problemas económicos, conflictos familiares, etc."></textarea>
      </div>

      <button id="btn-analizar" onclick="analizarEstudiante()">
        🔍 Analizar con IA
      </button>
    </section>

    <!-- RESULTADO -->
    <section class="tarjeta" id="seccion-resultado" style="display:none">
      <h2>📋 Resultado del Análisis</h2>

      <div id="cargando" style="display:none" class="cargando">
        <div class="spinner"></div>
        <p>La IA está analizando el perfil... esto puede tomar unos segundos.</p>
      </div>

      <div id="resultado-texto" class="resultado-texto"></div>

      <div id="acciones" style="display:none" class="acciones">
        <button onclick="guardarHistorial()" class="btn-secundario">💾 Guardar</button>
        <button onclick="nuevoAnalisis()" class="btn-ghost">↩ Nuevo análisis</button>
      </div>
    </section>

    <!-- HISTORIAL -->
    <section class="tarjeta" id="seccion-historial" style="display:none">
      <div class="historial-header">
        <h2>📁 Historial guardado</h2>
        <button onclick="limpiarHistorial()" class="btn-ghost pequeño">Limpiar</button>
      </div>
      <div id="lista-historial"></div>
    </section>

  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
